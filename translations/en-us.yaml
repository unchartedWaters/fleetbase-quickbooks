quickbooks:
  connection:
    title: QuickBooks Setup
    card-title: Connection
    loading: Loading QuickBooks connection.
    unavailable: QuickBooks status could not be loaded.
    settings-unavailable: QuickBooks settings could not be loaded.
    reauth-status: QuickBooks needs to be connected again before sync can continue. Choose Connect to QuickBooks.
    reauth-no-permission: QuickBooks needs to be connected again before sync can continue. You do not have permission to connect QuickBooks.
    reauth-unknown: QuickBooks needs to be connected again before sync can continue.
    reauth-save-first: QuickBooks needs to be connected again before sync can continue. First, an installation administrator must enter the QuickBooks credentials in Admin → QuickBooks → Settings.
    connected: "Connected to QuickBooks company {realm} ({environment})."
    connected-plain: "Connected to QuickBooks company {realm}."
    home-currency: "The QuickBooks home currency is {currency}."
    home-currency-where: "To check it in QuickBooks, open the gear menu → Account and settings → Advanced → Currency."
    home-currency-invoices: Invoices in another currency are sent only when Multicurrency is turned on in QuickBooks. Otherwise they fail and show in Activity.
    home-currency-wallet: A wallet in another currency fails when it has no QuickBooks account yet and Fleetbase is Primary. A wallet already linked to an account is still sent.
    home-currency-primary: "When QuickBooks is Primary for Accounts / Wallets and changes come from QuickBooks (Both or From QuickBooks), the wallet takes the QuickBooks account's currency."
    income-account: 'Invoice lines use the QuickBooks product of their name: one Fleetbase keeps for each Storefront product and Fleet-Ops fee, else "Fleetbase service", which posts to the income account {account}. Products Fleetbase makes post to that account and are taxed like "Fleetbase service". QuickBooks taxes a line only when its product and the customer are taxable. To change the account or whether lines are taxed, edit the products in QuickBooks.'
    disconnected-status: Not connected. Choose Connect to QuickBooks. Fleetbase then syncs customers, invoices, payments, and wallets with QuickBooks Online.
    disconnected-no-permission: Not connected. You do not have permission to connect QuickBooks. Fleetbase syncs customers, invoices, payments, and wallets with QuickBooks Online after QuickBooks is connected.
    disconnected-unknown: Not connected.
    disconnected-save-first: Not connected. An installation administrator must enter the QuickBooks credentials in Admin → QuickBooks → Settings before you can connect.
    disconnect: Disconnect
    disconnect-denied: You do not have permission to disconnect QuickBooks.
    disconnect-confirm-title: Disconnect QuickBooks?
    disconnect-confirm: This removes the saved QuickBooks connection. Syncing stops until you connect again.
    connect: Connect to QuickBooks
    disconnected-toast: QuickBooks disconnected.
    connected-toast: Connected to QuickBooks.
    connect-failed: Unable to start QuickBooks connection.
    oauth-cancelled: QuickBooks connection was cancelled.
    oauth-expired: That QuickBooks authorization expired. Connect again from QuickBooks Setup.
    oauth-failed: QuickBooks could not connect. Try again from QuickBooks Setup.
  actions:
    sync-now: Sync now
    sync-queued: Sync queued.
    sync-denied: You do not have permission to run Sync now.
  activity:
    title: Activity
    empty: No syncs yet. Connect on QuickBooks Setup, then choose Sync now or wait for the next scheduled sync.
    load-failed: Sync activity could not be loaded.
    credentials-where: Ask an installation administrator to check Client ID and Client secret in Admin → QuickBooks → Settings.
    loading: Loading sync activity.
    columns:
      when: When
      trigger: Trigger
      status: Status
      direction: Direction
      results: Results
    results:
      created: "{count} created"
      updated: "{count} updated"
      aligned: "{count} unchanged"
      linked: "{count} linked"
      voided: "{count} voided"
      unmatched: "{count} not matched"
      skipped: "{count} skipped"
      failed: "{count} failed"
      none: No changes
    trigger:
      scheduled: Scheduled
      now: Sync now
      manual: Reconcile
      import: Import customers
      catalog: Customer catalog
      drain: Continued sync
      webhook: QuickBooks change
    direction:
      outbound: To QuickBooks
      inbound: From QuickBooks
    status:
      skipped: Skipped
      finished: Finished
      running: Running
      failed: Failed
      pending: Pending
    record-error: "{record}: {message}"
    record:
      customer: Customer "{name}"
      invoice: Invoice {name}
      wallet: Wallet "{name}"
      product: Product "{name}"
      item: Product "{name}"
  widget:
    title: QuickBooks Sync
    refresh: Refresh QuickBooks status
    loading: Loading QuickBooks status.
    unavailable: QuickBooks status is unavailable.
    no-access: You do not have permission to view the QuickBooks sync status.
    last-sync: Last sync
    no-sync: No sync yet
    records-waiting: Records waiting
    waiting: "{count} waiting"
    credentials-missing: Sync now is unavailable until an installation administrator enters the QuickBooks Client ID and Client secret in Admin → QuickBooks → Settings.
    reauth: Needs to be connected again
    reauth-setup: Connect again on QuickBooks Setup.
    reauth-no-permission: You do not have permission to connect QuickBooks.
    connected: Connected
    disconnected: Not connected
  settings:
    save: Save Changes
    saved: QuickBooks settings saved.
    read-only-note: You can view these QuickBooks sync settings, but you do not have permission to change them.
    template-note: These are the current global defaults. They become this organization's own settings when you connect or save.
    copy-note: Changes to the global defaults do not affect this organization.
    admin-template-note: These sync settings are only a template. An organization's sync settings are copied from them when it connects, saves or resets its settings. Changing them here has no effect on any organization's sync settings.
    reset: Reset to global defaults
    reset-confirm-title: Reset to global defaults?
    reset-confirm: This replaces this organization's sync settings with a one-time copy of the current global defaults. Later changes to the global defaults will not affect them.
    reset-done: Sync settings reset to the global defaults.
    authentication: Authentication
    credentials-title: Getting your QuickBooks credentials
    credentials-create-app-before: "No QuickBooks app yet? Start with "
    credentials-create-app-link: Intuit's guide to creating a QuickBooks app
    credentials-create-app-after: "."
    credentials-step-keys-before: "Sign in at "
    credentials-step-keys-link: developer.intuit.com
    credentials-step-keys-after: " and open Keys & credentials."
    credentials-step-form: Choose the Environment, then copy its Client ID and Client secret from Keys & credentials into the fields below.
    credentials-step-redirect: Under Redirect URIs, paste the Public OAuth Redirect URL.
    credentials-step-webhook: Paste the Public Webhook Receiver URL into Intuit and save the webhook verifier.
    credentials-step-save: Choose Save Changes. Each organization then connects from its own QuickBooks Setup page.
    schedule: Schedule
    data-resolution: Data Resolution
    data-resolution-description: Which records sync, which system wins when they differ, and which way changes move.
    primary: Primary
    primary-help: Which system wins when records differ, and which supplies identifiers such as invoice numbers. With Fleetbase as Primary, edits made in QuickBooks are replaced and payments recorded in QuickBooks are not copied to Fleetbase.
    entity-primary: "{entity} Primary"
    sync-direction: Sync direction
    sync-direction-help: Both keeps the two systems in step. To QuickBooks only sends Fleetbase changes. From QuickBooks only brings QuickBooks changes into Fleetbase.
    entity-sync-direction: "{entity} Sync direction"
    client-secret: Client secret
    client-secret-help: "On Keys & credentials, next to the Client ID. Stored encrypted."
    client-secret-saved: A Client secret is already saved. Leave this blank to keep it.
    verifier: Webhook verifier token
    verifier-help: Intuit signs webhooks with this token. Stored encrypted.
    secret-mask: "••••••••{hint}"
    show-value: "Show {field}"
    hide-value: "Hide {field}"
    verifier-saved: A verifier token is already saved. Leave this blank to keep it.
    fields:
      client-id: Client ID
      environment: Environment
      interval-minutes: Sync frequency (minutes)
      periodic-interval-hours: Full sync frequency (hours)
      retry-limit: Retry attempts
      retry-delay: Retry delay (seconds)
    hints:
      client-id: "On Keys & credentials. Use the Development Client ID with Sandbox, and the Production Client ID with your live company."
      environment: Sandbox uses the Development keys and a QuickBooks sandbox company. Production uses the Production keys and your live QuickBooks Online company.
      interval-minutes: Minutes between scheduled syncs of waiting changes. 20 or more waiting changes start one sooner.
      periodic-interval-hours: Hours between full passes over the customer catalog. Waiting changes use the minutes setting above.
      retry-limit: Retries after a failure. Later tries wait longer.
      retry-delay: Seconds before the first retry. Later tries wait longer, up to 15 minutes.
    urls:
      internal-webhook: Fleetbase webhook receiver
      internal-webhook-hint: Fleetbase listens for webhooks here. Copy the Public Webhook Receiver URL into Intuit.
      public-webhook: Public Webhook Receiver URL
      public-webhook-hint: Paste this into the Intuit webhook Endpoint URL.
      internal-oauth: Fleetbase OAuth redirect
      internal-oauth-hint: Fleetbase receives the QuickBooks sign-in return here. Copy the Public OAuth Redirect URL into Intuit.
      public-oauth: Public OAuth Redirect URL
      public-oauth-hint: Paste this into Intuit Redirect URIs.
      not-public: This is not a public https:// address, so Intuit cannot reach it. Enter the address Fleetbase is reached at from the internet.
    options:
      sandbox: Sandbox
      production: Production
      fleetbase: Fleetbase
      quickbooks: QuickBooks
      both: Both
      outbound: To QuickBooks
      inbound: From QuickBooks
    entities:
      customer: Customers
      invoice: Invoices
      payment: Payments
      wallet: Accounts / Wallets
  validation:
    client-id: "Enter the Client ID from developer.intuit.com → your app → Keys & credentials."
    environment: "Choose Sandbox for Development keys, or Production for your live company."
    client-secret: "Enter the Client secret shown next to the Client ID on Keys & credentials."
    webhook-verifier: "Enter the Verifier Token from developer.intuit.com → your app → Webhooks. A new Client ID needs its own token."
    interval-minutes: Enter a whole number of minutes, at least 1.
    periodic-interval-hours: Enter a whole number of hours, at least 1.
    retry-limit: Enter a whole number of retry attempts, at least 1.
    retry-delay: Enter a whole number of seconds for Retry delay, at least 5.
    choice: Choose one of the listed options.
    direction-customer: Choose Both, To QuickBooks, or From QuickBooks for Customers.
    direction-invoice: Choose Both, To QuickBooks, or From QuickBooks for Invoices.
    direction-payment: Choose Both, To QuickBooks, or From QuickBooks for Payments.
    direction-wallet: Choose Both, To QuickBooks, or From QuickBooks for Accounts / Wallets.
    redirect-uri: "Enter a full http:// or https:// address that is listed under Keys & credentials, Redirect URIs."
    public-webhook-url: "Public Webhook Receiver URL must be an https:// address whose host resolves to a public IP address. Check the address, or try again if DNS is not answering. Nothing was saved."
    public-oauth-url: "Public OAuth Redirect URL must be an https:// address whose host resolves to a public IP address. Check the address, or try again if DNS is not answering. Nothing was saved."
    batch-size: Enter a whole number from 1 to 100.
    on-off: Choose On or Off.
    primary-customer: Choose Fleetbase or QuickBooks as Primary for Customers.
    primary-invoice: Choose Fleetbase or QuickBooks as Primary for Invoices.
    primary-payment: Choose Fleetbase or QuickBooks as Primary for Payments.
    primary-wallet: Choose Fleetbase or QuickBooks as Primary for Accounts / Wallets.
  messages:
    unauthorized: This action is unauthorized.
    organization-required: Sign in to an organization to manage QuickBooks.
    organization-mismatch: You may only manage the QuickBooks connection for your own organization.
    not-set-up: "QuickBooks is not set up yet. Ask an installation administrator to enter the Client ID, Client secret and Public OAuth Redirect URL in Admin → QuickBooks → Settings."
    redirect-not-public: "QuickBooks cannot be connected yet: Intuit needs a public https:// address to send you back to. Ask an installation administrator to enter the Public OAuth Redirect URL in Admin → QuickBooks → Settings and add the same URL to the Intuit app."
    not-connected: QuickBooks is not connected.
    not-connected-connect: QuickBooks is not connected. Connect from QuickBooks Setup.
    not-connected-reconnect: QuickBooks is not connected. Connect again from QuickBooks Setup.
    connection-works: QuickBooks connection works.
    console-host: Set CONSOLE_HOST so QuickBooks can return to the console.
    reauth: QuickBooks needs to be connected again. Choose Connect to QuickBooks on QuickBooks Setup.
    import-reauth: QuickBooks needs to be connected again before import can continue. Choose Connect to QuickBooks on QuickBooks Setup.
    oauth-other-user: This QuickBooks authorization was started by a different user or organization. Connect again from QuickBooks Setup.
    oauth-change-company: Only a QuickBooks Administrator can connect this organization to a new or different QuickBooks company. You can connect again to the QuickBooks company it already uses.
    oauth-connect-failed: QuickBooks could not finish connecting. Connect again from QuickBooks Setup.
    oauth-invalid-link: This QuickBooks authorization link is not valid. Connect again from QuickBooks Setup.
    oauth-state-invalid: QuickBooks authorization state is invalid or expired.
    settings-invalid: Some QuickBooks settings are missing or invalid.
    settings-organization-scope: An organization can only change its sync options. Global QuickBooks settings are changed in Admin → QuickBooks → Settings.
    settings-organization-fields: Send only scope, sync, and reset.
    settings-unknown-scope: Unknown QuickBooks settings scope.
    refresh-running: This run was skipped because Fleetbase is already renewing the QuickBooks sign-in.
    credentials-refused: QuickBooks refused the app's Client ID or Client secret. Ask an installation administrator to check them in Admin → QuickBooks → Settings.
    refresh-unavailable: Fleetbase could not renew the QuickBooks sign-in. It tries again on the next sync.
    lock-unavailable: This run was skipped because the Fleetbase server's cache does not support locks. Ask an installation administrator to check the cache settings.
    sync-running: Another QuickBooks sync is already running.
    rate-limited: QuickBooks asked Fleetbase to wait (rate limit). Try again in a few minutes.
    sync-failed: Sync failed.
    save-failed: Fleetbase could not save the results of this sync. The records in it are tried again later.
    webhook-read-failed: Fleetbase could not read a change from QuickBooks after several tries, so it was not applied. Save the record in QuickBooks again to send it again.
    failed-count: "{count} failed."
    transport: QuickBooks could not be reached. Try again in a few minutes.
    request-failed: "QuickBooks request failed with status {status}"
    request-failed-detail: "QuickBooks request failed with status {status}: {detail}"
    request-rejected: "QuickBooks rejected the request: {detail}"
    payment-method-note: "Fleetbase payment method: {method}"
    fleetbase-primary-replaced: Fleetbase is Primary here, so the change made in QuickBooks was replaced with the Fleetbase values. Choose QuickBooks as Primary to keep changes made in QuickBooks.
    access-token-refused: "QuickBooks request failed with status 401: the access token was refused."
    query-failed: QuickBooks query failed.
    invoice-lookup-failed: QuickBooks invoice lookup failed.
    payment-lookup-failed: QuickBooks payment lookup failed.
    batch-item-missing: QuickBooks batch response did not include this item.
    batch-item-no-entity: QuickBooks batch item had no entity.
    batch-item-unsupported: Unsupported batch item.
    item-rejected: QuickBooks rejected this item.
    import-customers-off: Customers are turned off in Data Resolution, so they are not imported.
    import-failed: Customer import failed.
    customer-missing: Customer no longer exists in Fleetbase.
    customer-name-taken: 'QuickBooks did not accept customer "{name}": a QuickBooks customer, vendor or employee already uses that name. Rename one of them, then sync again.'
    wallet-missing: Wallet no longer exists in Fleetbase.
    remote-delete-kept:
      customer: "A customer deleted in QuickBooks (ID {id}) was kept in Fleetbase. The customer sync settings do not let QuickBooks remove Fleetbase records."
      invoice: "An invoice deleted or voided in QuickBooks (ID {id}) was kept in Fleetbase. The invoice sync settings do not let QuickBooks remove Fleetbase records."
      payment: "A payment deleted or voided in QuickBooks (ID {id}) is still counted in Fleetbase. The payment sync settings do not let QuickBooks remove Fleetbase records."
      wallet: "An account deleted in QuickBooks (ID {id}) was kept as a wallet in Fleetbase. The wallet sync settings do not let QuickBooks remove Fleetbase records."
    remote-merge-moved:
      customer: "QuickBooks merged customer {id} into customer {into}. The Fleetbase customer now syncs with customer {into}."
      wallet: "QuickBooks merged account {id} into account {into}. The Fleetbase wallet now syncs with account {into}."
    remote-merge-kept:
      customer: "QuickBooks merged customer {id} into customer {into}, which another Fleetbase customer already syncs with. Both Fleetbase customers were kept; merge them in Fleetbase if they are the same."
      wallet: "QuickBooks merged account {id} into account {into}, which another Fleetbase wallet already syncs with. Both Fleetbase wallets were kept."
    remote-delete-late: QuickBooks reported a delete too late to apply it safely. Check this record in QuickBooks and Fleetbase.
    remote-delete-wallet-balance: "An account deleted in QuickBooks (ID {id}) was kept as a wallet in Fleetbase, because the wallet still holds a balance or its balance could not be read."
    invoice-missing: Invoice no longer exists in Fleetbase.
    invoice-customer-off: Customer sync is off, so this invoice cannot be synced.
    invoice-customer-failed: Invoice customer could not be synced to QuickBooks.
    invoice-customer-invalid: Invoice customer is not a Fleetbase customer.
    invoice-customer-not-linked: "QuickBooks moved this invoice to customer {id}, which is not linked to a Fleetbase customer. The Fleetbase customer was kept."
    invoice-item-missing: "QuickBooks has no item for invoice lines. Fleetbase could not create its \"Fleetbase service\" item; add an Income account in QuickBooks and try again."
    invoice-product-failed: 'Fleetbase could not make a QuickBooks product for line "{name}", so the line uses the "Fleetbase service" item.'
    products-unavailable: Storefront products could not be read, so this was not synced. It is tried again on the next sync.
    product-adopted: 'QuickBooks already has a product named "{name}". Fleetbase uses it as it is and never changes it.'
    product-inactive: 'QuickBooks product "{name}" is inactive, so invoice lines with this name use the "Fleetbase service" item. Make the product active in QuickBooks to use it again.'
    product-name-taken: 'QuickBooks did not accept product "{name}": another QuickBooks product or category already uses that name. Rename one of them, then sync again.'
    payment-capped: The amount paid in Fleetbase is more than the QuickBooks invoice total, so the payment was sent to QuickBooks for the invoice total. The rest stays recorded in Fleetbase only.
    invoice-no-tax-rate: The invoice was sent, but QuickBooks added no tax because neither the customer nor the company has a sales tax rate in QuickBooks. Set a sales tax rate in QuickBooks and edit the invoice to add the tax.
    invoice-tax-lowered: QuickBooks worked out less tax for this invoice than Fleetbase had, so the Fleetbase tax, line tax rates and total were changed to the QuickBooks ones and the total went down. A payment above the new total is sent to QuickBooks for the total only. Check which products and customers are taxable, and the sales tax settings, in QuickBooks.
    invoice-tax-from-quickbooks: QuickBooks worked out the tax of this invoice, so the tax rates on its lines in Fleetbase were changed to the QuickBooks rates.
    invoice-number-unconfirmed: QuickBooks did not confirm a free invoice number, so Fleetbase did not create this invoice.
    invoice-number-taken: "QuickBooks invoice number {number} was not copied because another Fleetbase invoice already uses it."
    invoice-number-kept: "This invoice keeps {number}."
    invoice-number-too-long: "Invoice number {number} has more than the {max} characters QuickBooks accepts, so it was not sent. Use a shorter invoice number or prefix."
    invoice-payments-multiple: This invoice has more than one QuickBooks payment, so Fleetbase left them unchanged.
    payment-shared: This QuickBooks payment also applies credits or other invoices, so Fleetbase left it unchanged. Change it in QuickBooks.
    wallet-currency-mismatch: "Wallet currency {currency} does not match the QuickBooks home currency {home}."
    invoice-currency-mismatch: "Invoice currency {currency} does not match the QuickBooks home currency {home}."
