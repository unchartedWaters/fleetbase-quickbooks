---
# JSHint cannot parse the Ember code here (decorators, class fields), so every file it
# reads is a false report. ESLint with the Ember plugin checks this JavaScript instead.
engines:
  jshint:
    exclude_paths:
      - "addon/**"
      - "app/**"
      - "tests/**"
      - "config/**"
      - "*.js"
      - "scripts/**/*.mjs"
  # Lizard's function-length rule (50 lines) flags test setup helpers, which build whole
  # fixtures in one place by design. Production code under server/src is still checked.
  # Ember component tests are the same kind of fixture, so tests/ is excluded too.
  lizard:
    exclude_paths:
      - "server/tests/**"
      - "tests/**"
  # PHPMD on the whole engine, so test fixtures and the upstream constructor stub
  # in scripts/test-support are not refactored to satisfy complexity rules.
  # scripts/fleetbase-release holds command-line checks run inside a Fleetbase
  # container by the release check workflow; their exit code is the result.
  phpmd:
    exclude_paths:
      - "server/tests/**"
      - "scripts/test-support/**"
      - "scripts/fleetbase-release/**"
