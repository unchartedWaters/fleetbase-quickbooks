name: Release deployment

# On a v* tag this publishes both packages under the `release` environment,
# so the jobs show as one deployment. It does not run on branch pushes.
#
# npmjs publishes @unchartedwaters/quickbooks-engine to registry.npmjs.org
# with the organization secret NPM_AUTH_TOKEN. ember.yml job github_publish
# still publishes that engine to GitHub Packages and does not publish to npmjs.
#
# registry_publish is the Fleetbase registry path: npm-cli-login, `flb publish`,
# then `flb bundle --upload`. `flb publish` runs `npm publish` against
# https://registry.fleetbase.io. That registry stores composer.json from the
# tarball, and Composer resolves unchartedwaters/quickbooks-api from it.
# The upload API only attaches a bundle to an extension it can already find
# by package name, so the first listing is still created in the Fleetbase
# console. Later tags upload the new bundle.
#
# Both publish jobs wait for `check`, which fails unless the tagged commit is
# on main, and for the PHP and Ember test workflows (server.yml, ember.yml),
# which this workflow calls.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: lts/*
  PNPM_VERSION: 12.4.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main. Release from a commit on main."
            exit 1
          fi

      - name: Check package versions match
        run: python3 .github/workflows/check-versions.py

      - name: Check tag matches package version
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} must be v${version}."
            exit 1
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check the registry tarball includes the Composer package
        run: python3 .github/workflows/check-registry-manifest.py

  php_tests:
    uses: ./.github/workflows/server.yml

  ember_tests:
    uses: ./.github/workflows/ember.yml
    with:
      test_only: true
    # A called workflow may not ask for more than its caller grants, and
    # ember.yml's github_publish job declares packages: write. That job is
    # skipped here (test_only), so nothing in this call publishes.
    permissions:
      contents: read
      packages: write

  npmjs:
    needs: [check, php_tests, ember_tests]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Set up npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc

      - name: Publish to npmjs
        run: npm publish --access public --registry https://registry.npmjs.org/

  registry_publish:
    needs: [check, php_tests, ember_tests]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Fleetbase CLI
        run: npm i -g @fleetbase/cli@0.0.6 npm-cli-login@1.0.0

      - name: Login to Fleetbase Registry
        env:
          NPM_USER: ${{ secrets.FLEETBASE_REGISTRY_USERNAME }}
          NPM_PASS: ${{ secrets.FLEETBASE_REGISTRY_PASSWORD }}
          NPM_EMAIL: ${{ secrets.FLEETBASE_REGISTRY_EMAIL }}
          NPM_REGISTRY: https://registry.fleetbase.io
        run: npm-cli-login

      - name: Confirm registry login
        run: npm whoami --registry https://registry.fleetbase.io

      - name: Publish to Fleetbase registry
        run: flb publish

      - name: Upload extension bundle
        run: flb bundle --upload
