name: Ember.js CI

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  # deploy.yml calls this workflow so a release waits for the frontend tests.
  # It passes test_only so the GitHub Packages publish below runs only from
  # this workflow's own tag push, not a second time from the release.
  workflow_call:
    inputs:
      test_only:
        type: boolean
        default: true

permissions:
  contents: read

env:
  NODE_VERSION: lts/*
  PNPM_VERSION: 12.4.2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Check package versions match
      run: python3 .github/workflows/check-versions.py

    - name: Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ env.PNPM_VERSION }}

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Test
      run: pnpm test

    - name: Build
      run: pnpm run build

  # npmjs publish is deploy.yml on v* tags. This job publishes GitHub Packages only.
  github_publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !inputs.test_only
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main. Release from a commit on main."
            exit 1
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure npm for GitHub registry
        run: |
          echo "@unchartedwaters:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Publish to GitHub registry
        run: npm publish --registry https://npm.pkg.github.com/
